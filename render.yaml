# Community-maintained template, not tested in CI.
# Thinker: https://github.com/patrickbrandao/thinker (deploy/ for the other templates)
services:
  - type: web
    name: thinker
    runtime: image
    image:
      url: docker.io/tmsoftbrasil/thinker:0.1
    plan: starter
    numInstances: 1
    healthCheckPath: /api/v1/health
    autoDeployTrigger: off
    disk:
      name: thinker-recordings
      mountPath: /data/request-recordings
      sizeGB: 1
    envVars:
      - key: PORT
        value: 2099
      - key: DATABASE_URL
        fromDatabase:
          name: thinker-postgres
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: THINKER_ENCRYPTION_KEY
        generateValue: true
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: thinker
          envVarKey: RENDER_EXTERNAL_URL
      - key: REQUEST_RECORDING_STORAGE
        value: filesystem
      - key: REQUEST_RECORDING_FILESYSTEM_PATH
        value: /data/request-recordings

databases:
  - name: thinker-postgres
    plan: free
    databaseName: thinker
    user: thinker
    ipAllowList: []
