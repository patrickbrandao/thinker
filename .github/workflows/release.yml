name: Release

# Publishes a Thinker release when a `vX.Y.Z` (or `vX.Y.Z-rc.N`) tag is pushed:
#
#   1. checks that the tag matches packages/thinker/package.json and that the
#      Docker Hub secrets are configured (fails clearly otherwise);
#   2. builds docker/Dockerfile natively on amd64 and arm64 runners and pushes
#      each image by digest to Docker Hub (tmsoftbrasil/thinker);
#   3. merges both digests into one multi-arch manifest tagged `X.Y.Z`, `X.Y`,
#      `latest` and `sha-<short>` (prereleases get only `X.Y.Z-rc.N` and
#      `sha-<short>`, never `X.Y` or `latest`);
#   4. creates or updates the GitHub release with the Portuguese notes from
#      docs/releases/X.Y.Z.md, marked latest for stable versions.
#
# Only GitHub-owned actions plus docker/setup-buildx-action and
# docker/build-push-action are on the repository's allowed-actions list, so
# Docker Hub login and tag computation are plain shell steps. Using any other
# third-party action makes GitHub reject the run with startup_failure.
#
# workflow_dispatch runs a dry run: same preflight, both architectures are
# built, tags are computed and printed, but nothing is pushed and no release
# is created. The Docker Hub secrets are not required in a dry run.
#
# This is the only workflow allowed to use DOCKERHUB_USERNAME / DOCKERHUB_TOKEN.
# It calls no service other than GitHub and Docker Hub.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: tmsoftbrasil/thinker
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.secrets.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Docker Hub secrets
        id: secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Without the secrets, scripts/ship.sh publishes from the local
          # Docker instead, so a tag push only records a notice here.
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::Docker Hub secrets are not set (ignored in dry run)."
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Docker Hub secrets are not set; skipping CI publishing (scripts/ship.sh publishes from the local Docker)."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag, package version and release notes
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./packages/thinker/package.json').version")
          if [ "$DRY_RUN" = "true" ]; then
            version="$pkg"
          else
            version="${TAG#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Version $version is not X.Y.Z or X.Y.Z-rc.N." >&2
            exit 1
          fi
          if [ "$version" != "$pkg" ]; then
            echo "::error::Tag $TAG does not match packages/thinker/package.json version $pkg." >&2
            exit 1
          fi
          notes="docs/releases/${version%%-*}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Release notes $notes are missing." >&2
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push (${{ matrix.platform }})
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: env.DRY_RUN != 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          # No cache-from: release images are built from scratch.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.DRY_RUN != 'true' }}
          labels: |
            org.opencontainers.image.title=thinker
            org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Export digest
        if: env.DRY_RUN != 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.DRY_RUN != 'true'
        with:
          name: digest-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Multi-arch manifest
    needs: [preflight, build]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.DRY_RUN != 'true'
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: env.DRY_RUN != 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Compute tags
        id: meta
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tags=("$IMAGE:$VERSION")
          if [ "$PRERELEASE" = "false" ]; then
            tags+=("$IMAGE:${VERSION%.*}" "$IMAGE:latest")
          fi
          tags+=("$IMAGE:sha-${SHA:0:7}")
          printf '%s\n' "${tags[@]}"
          {
            echo "tags<<EOF_TAGS"
            printf '%s\n' "${tags[@]}"
            echo "EOF_TAGS"
          } >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            {
              echo "### Dry run: nothing pushed"
              echo '```'
              printf '%s\n' "${tags[@]}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create and push the manifest list
        if: env.DRY_RUN != 'true'
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<< "$TAGS"
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"

      - name: Inspect
        if: env.DRY_RUN != 'true'
        id: inspect
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          platforms=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r '[.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | sort | join(",")')
          echo "platforms=$platforms"
          test "$platforms" = "linux/amd64,linux/arm64"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### $IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: GitHub release
    needs: [preflight, manifest]
    if: github.event_name == 'push' && needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.preflight.outputs.version }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          DIGEST: ${{ needs.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          cat "docs/releases/${VERSION%%-*}.md" > "$notes"
          {
            echo
            echo "## Imagem Docker"
            echo
            echo '```'
            echo "docker pull $IMAGE:$VERSION"
            echo "# $IMAGE@$DIGEST"
            echo '```'
          } >> "$notes"
          if [ "$PRERELEASE" = "true" ]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--latest)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Thinker $VERSION" --notes-file "$notes" "${flags[@]}"
          else
            gh release create "$TAG" --verify-tag --title "Thinker $VERSION" --notes-file "$notes" "${flags[@]}"
          fi
