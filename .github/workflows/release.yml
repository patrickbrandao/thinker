name: Release

# Publishes a Thinker release when a `vX.Y.Z` (or `vX.Y.Z-rc.N`) tag is pushed:
#
#   1. checks that the tag matches packages/thinker/package.json and that the
#      Docker Hub secrets are configured (fails clearly otherwise);
#   2. builds docker/Dockerfile natively on amd64 and arm64 runners and pushes
#      each image by digest to Docker Hub (tmsoftbrasil/thinker);
#   3. merges both digests into one multi-arch manifest tagged `X.Y.Z`, `X.Y`,
#      `latest` and `sha-<short>` (prereleases get only `X.Y.Z-rc.N` and
#      `sha-<short>`, never `X.Y` or `latest`);
#   4. creates or updates the GitHub release with the Portuguese notes from
#      docs/releases/X.Y.Z.md, marked latest for stable versions.
#
# This is the only workflow allowed to use DOCKERHUB_USERNAME / DOCKERHUB_TOKEN.
# It calls no service other than GitHub and Docker Hub.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: tmsoftbrasil/thinker

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=0
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Add it under Settings > Secrets and variables > Actions, then re-run this workflow." >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Check tag, package version and release notes
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          pkg=$(node -p "require('./packages/thinker/package.json').version")
          if [ "$version" != "$pkg" ]; then
            echo "::error::Tag $TAG does not match packages/thinker/package.json version $pkg." >&2
            exit 1
          fi
          notes="docs/releases/${version%%-*}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Release notes $notes are missing." >&2
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push (${{ matrix.platform }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          # No cache-from: release images are built from scratch.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=thinker
            org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Multi-arch manifest
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.preflight.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.prerelease == 'false' }}
            type=sha,prefix=sha-,format=short

      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<< "$TAGS"
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"

      - name: Inspect
        id: inspect
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          platforms=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r '[.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture] | sort | join(",")')
          echo "platforms=$platforms"
          test "$platforms" = "linux/amd64,linux/arm64"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### $IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: GitHub release
    needs: [preflight, manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.preflight.outputs.version }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          DIGEST: ${{ needs.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          cat "docs/releases/${VERSION%%-*}.md" > "$notes"
          {
            echo
            echo "## Imagem Docker"
            echo
            echo '```'
            echo "docker pull $IMAGE:$VERSION"
            echo "# $IMAGE@$DIGEST"
            echo '```'
          } >> "$notes"
          if [ "$PRERELEASE" = "true" ]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--latest)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Thinker $VERSION" --notes-file "$notes" "${flags[@]}"
          else
            gh release create "$TAG" --verify-tag --title "Thinker $VERSION" --notes-file "$notes" "${flags[@]}"
          fi
