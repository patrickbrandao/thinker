name: CI

# Full CI (#20): lint, typecheck, build (with generated-file drift check),
# unit tests per workspace, backend e2e against PostgreSQL in two time zones,
# and the root scripts' tests. Jobs address workspaces by
# path (packages/<name>); the npm workspace names are thinker-* since #19.
#
# None of these jobs is path-filtered, so every one of them can be a required
# check on main. The Docker image build (docker.yml), the Compose smoke test
# (docker-smoke.yml) and CodeQL are path-filtered and must not be required.
#
# Every action is pinned to a full commit SHA. When adding one, resolve the
# tag with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` (dereference
# annotated tags) and add it to the repository's allowed-actions list.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A PR run is superseded by the next push to the same PR. Pushes to main are
  # grouped per commit, so a newer push never cancels (or replaces, while
  # still pending) the run of an older one: every commit on main is tested.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # No phone-home from CI tooling.
  DO_NOT_TRACK: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ESLint over every package's src/ plus packages/backend/test.
      - run: npm run lint
      # Dashboard i18n (#42): en/pt-BR keys in sync, no hard-coded UI text.
      - run: npm run check:i18n --workspace=thinker-frontend
      - name: Design-system registry is up to date
        run: npm run design:registry:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The other workspaces resolve thinker-shared's types from its build
      # output, so it is built first.
      - run: npm run build --workspace=packages/shared
      # `tsc6 --noEmit` (TypeScript 6, the `typescript` alias to
      # @typescript/typescript6) in every workspace. The backend run covers
      # src/ and test/ (tsconfig.test.json).
      - run: npm run typecheck --workspaces --if-present

  typecheck-ts7:
    # TypeScript 7 (tsgo, #87, option B): type-check only. Emit, tests, lint
    # and migrations stay on TypeScript 6, so nothing this job runs reaches
    # the image. Same tsconfig files as the TS 6 job.
    name: Typecheck (TypeScript 7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/shared
      - name: tsgo version
        run: node -p "'TypeScript ' + require('@typescript/native/package.json').version"
      # scripts/tsgo.mjs runs @typescript/native (typescript@7) with
      # --noEmit in each workspace.
      - run: npm run typecheck:ts7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/shared
      - name: Build backend (nest build)
        run: npm run build --workspace=packages/backend
      - name: Build frontend (vite build)
        run: npm run build --workspace=packages/frontend
      # Regenerates src/provider-catalog.gen.ts and src/skill-content.gen.ts
      # before compiling.
      - name: Build CLI
        run: npm run build --workspace=packages/cli
      - name: Generated files are committed and up to date
        run: |
          changes=$(git status --porcelain --untracked-files=all)
          if [[ -n "$changes" ]]; then
            echo "::error::The build changed tracked files or left untracked files. Run the builds locally and commit the result."
            echo "$changes"
            git --no-pager diff
            exit 1
          fi

  unit:
    name: Unit (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend, shared, cli]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Every other workspace resolves the shared package from its build
      # output, so it is built first.
      - run: npm run build --workspace=packages/shared
      - run: npm test --workspace=packages/${{ matrix.workspace }}
      # GitHub runners are on UTC, where UTC and local formatting agree. Some
      # backend specs assume the host zone, so run them once more outside UTC
      # (the bug class of #53).
      - name: Backend unit tests with TZ=America/Sao_Paulo
        if: matrix.workspace == 'backend'
        run: npm test --workspace=packages/backend
        env:
          TZ: America/Sao_Paulo

  backend-e2e:
    name: Backend e2e (PostgreSQL, TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The Node side reads and writes `timestamp without time zone` in the
        # local zone, so the suite runs in UTC and outside it (#53). The
        # PostgreSQL container stays on UTC.
        tz: [UTC, America/Sao_Paulo]
    services:
      postgres:
        # Same image and digest as docker/docker-compose.yml.
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          # The e2e guard (#67) only drops a database whose name contains
          # "test", and only with THINKER_E2E_ALLOW_DROP=1.
          POSTGRES_DB: thinker_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myuser -d thinker_e2e_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Throwaway values for the disposable service container above.
      DATABASE_URL: postgresql://myuser:mypassword@localhost:5432/thinker_e2e_test
      THINKER_E2E_ALLOW_DROP: "1"
      BETTER_AUTH_SECRET: ci-test-secret-at-least-32-characters-long!!
      THINKER_ENCRYPTION_KEY: ci-test-encryption-key-at-least-32-characters!!
      NODE_ENV: test
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/shared
      - name: Run migrations
        run: npm run migration:run --workspace=packages/backend
      - run: npm run test:e2e --workspace=packages/backend

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # node:test over scripts/*.test.js. They use Node built-ins only, so no
      # npm install is needed.
      - run: npm run test:scripts
