name: CI

# Provisional minimal CI (#38): lint, unit tests and backend e2e, still on
# the inherited workspace names. The full CI with the Thinker names
# (typecheck, builds, scripts, changeset check) lands in #20.
#
# Every action is pinned to a full commit SHA. When adding one, resolve the
# tag with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` (dereference
# annotated tags) and add it to the repository's allowed-actions list.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled; every commit on main is tested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # No phone-home from CI tooling.
  DO_NOT_TRACK: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    name: Unit (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend, shared, cli]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Every other workspace resolves the shared package from its build
      # output, so it is built first.
      - run: npm run build --workspace=packages/shared
      - run: npm test --workspace=packages/${{ matrix.workspace }}

  backend-e2e:
    name: Backend e2e (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Same major as docker/docker-compose.yml. PostgreSQL 18 lands in v0.2.
        image: postgres:16
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: mydatabase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myuser -d mydatabase"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Throwaway values for the disposable service container above.
      DATABASE_URL: postgresql://myuser:mypassword@localhost:5432/mydatabase
      BETTER_AUTH_SECRET: ci-test-secret-at-least-32-characters-long!!
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/shared
      - name: Run migrations
        run: npm run migration:run --workspace=packages/backend
      - run: npm run test:e2e --workspace=packages/backend
