# Dependabot version updates for Thinker.
#
# Patch and minor (and digest) updates are proposed, grouped per ecosystem.
# Majors are ignored through an explicit list (#80): each npm and
# docker-compose entry names the v0.2 issue that performs that upgrade, in
# the order set by the upgrade policy (docs/decisoes-iniciais.md §4, plan in
# #99): PostgreSQL 18 → NestJS → TypeORM → Vite → TypeScript, then the
# remaining majors. Some entries are permanent pins instead (`node`, the
# distroless base image, `@types/node`), because the runtime is Node 24.
#
# The v0.2 upgrade PRs do NOT edit this file. Every entry stays until #97,
# which removes the finished ones together (and turns the @types/node entry
# into a permanent `versions: [">=25"]`). A new major that shows up in
# `npm outdated` and is not in the list gets an entry here and its own v0.2
# issue.
#
# uuid: its newer majors are ESM-only, and the CommonJS backend cannot
# require() them (upstream CI broke this way). Do not take a uuid major while
# the backend is CommonJS; #90 removes the dependency instead.
#
# The `applies-to: security-updates` groups below only take effect while
# Dependabot security updates are enabled for the repository. They are off
# today (automated-security-fixes disabled); turning them on is a maintainer
# decision proposed in #20, now that CI validates every Dependabot PR.

# npm version: Dependabot (dependabot-core npm_and_yarn PackageManagerHelper)
# reads the root `packageManager` field and installs that exact npm through
# Corepack before regenerating package-lock.json; `engines` and the
# lockfileVersion are only fallbacks. With `npm@10.9.2` it produced npm 10
# lockfiles that mark optional native deps `"peer": true` and break `npm ci`
# (#147). Keep `packageManager` equal to the npm bundled with the Node 24 used
# in CI (npm 11.19.0 today) and bump both together.

version: 2
updates:
  # npm workspaces: Dependabot reads the root package.json and every
  # workspace package.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - area:infra
    commit-message:
      prefix: chore(deps)
    groups:
      # vitest and @vitest/* pin each other via exact peer deps, so solo bumps
      # produce unresolvable PRs. Grouping them moves the whole family at once.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Better Auth minor releases can require database migrations. Keep the
      # package family together and out of broad dependency bundles.
      better-auth:
        applies-to: version-updates
        patterns:
          - "better-auth"
          - "@better-auth/*"
      better-auth-security:
        applies-to: security-updates
        patterns:
          - "better-auth"
          - "@better-auth/*"
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
          - "better-auth"
          - "@better-auth/*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    # Explicit major ignores (see the header). Majors pending in
    # `npm outdated` on 2026-10-26; @changesets/cli is gone (Changesets was
    # retired in v0.1.5) and js-yaml is no longer a direct dependency.
    ignore:
      # #83 NestJS 11 → 12 (whole family: core, cli, schematics, testing,
      # config, schedule, typeorm, serve-static, cache-manager).
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      # #84 TypeORM 0.3 → 1.x.
      - dependency-name: "typeorm"
        update-types: ["version-update:semver-major"]
      # #85 Vite 6 → 7, then #86 Vite 7 → 8.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # #82 moved every workspace to TypeScript 6; #87 brings TypeScript 7
      # to the typecheck job only (tsgo), the rest of TS 7 is deferred.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # #89 eventsource-parser 3 → 4 (SSE parser of the proxy).
      - dependency-name: "eventsource-parser"
        update-types: ["version-update:semver-major"]
      # #90 replaces uuid with crypto.randomUUID (the dependency goes away).
      - dependency-name: "uuid"
        update-types: ["version-update:semver-major"]
      # #91 @types/supertest 6 → 7.
      - dependency-name: "@types/supertest"
        update-types: ["version-update:semver-major"]
      # Permanent: @types/node follows the runtime Node major (24). #92 moved
      # it to 24; #97 turns this entry into `versions: [">=25"]`.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # #93 Jest 29 → 30 in packages/cli (the other workspaces are on 30).
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      # #95 @solidjs/router 0.16 → 1.0.
      - dependency-name: "@solidjs/router"
        update-types: ["version-update:semver-major"]
      # #96 motion 12 → 14.
      - dependency-name: "motion"
        update-types: ["version-update:semver-major"]
      # undici 6 → 8 (backend SSRF-safe fetch): new major, not in the #99
      # plan; its v0.2 issue is still to be filed.
      - dependency-name: "undici"
        update-types: ["version-update:semver-major"]

  # Base images of docker/Dockerfile (node, distroless). Digest and
  # minor/patch bumps only.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - area:infra
    commit-message:
      prefix: chore(deps)
    groups:
      docker-patch-and-minor:
        patterns:
          - "*"
    ignore:
      # Permanent: the runtime is Node 24 (docs/decisoes-iniciais.md §4).
      # Node 26 would be a separate decision, not a v0.2 upgrade.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gcr.io/distroless/nodejs24-debian13"
        update-types: ["version-update:semver-major"]

  # The Postgres image of docker/docker-compose.yml. The app image is built
  # by this repository, so only postgres is tracked here.
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - area:infra
    commit-message:
      prefix: chore(deps)
    allow:
      - dependency-name: "postgres"
    groups:
      docker-compose-patch-and-minor:
        patterns:
          - "*"
    ignore:
      # #81 PostgreSQL 16 → 18 (fresh volumes only), the first v0.2 major.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # Actions are pinned by commit SHA; Dependabot bumps the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - area:infra
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions-patch-and-minor:
        patterns:
          - "*"
    ignore:
      # Action majors stay ignored until #97, where the maintainer decides
      # on them.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
