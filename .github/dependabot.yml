# Dependabot version updates for Thinker.
#
# Patch and minor (and digest) updates are proposed, grouped per ecosystem.
# Since v0.2 (#97) majors arrive as individual Dependabot PRs and are taken
# one at a time, each validated in Docker before release. The only major
# ignores left are permanent pins (`node`, the distroless base image,
# `@types/node`, all tied to the Node 24 runtime) and deferred upgrades that
# name the issue tracking them.
#
# The `applies-to: security-updates` groups below only take effect while
# Dependabot security updates are enabled for the repository. They are off
# today (automated-security-fixes disabled); turning them on is a maintainer
# decision proposed in #20, now that CI validates every Dependabot PR.

# npm version: Dependabot (dependabot-core npm_and_yarn PackageManagerHelper)
# reads the root `packageManager` field and installs that exact npm through
# Corepack before regenerating package-lock.json; `engines` and the
# lockfileVersion are only fallbacks. With `npm@10.9.2` it produced npm 10
# lockfiles that mark optional native deps `"peer": true` and break `npm ci`
# (#147). Keep `packageManager` equal to the npm bundled with the Node 24 used
# in CI (npm 11.19.0 today) and bump both together.

version: 2
updates:
  # npm workspaces: Dependabot reads the root package.json and every
  # workspace package.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - area:infra
    commit-message:
      prefix: chore(deps)
    groups:
      # vitest and @vitest/* pin each other via exact peer deps, so solo bumps
      # produce unresolvable PRs. Grouping them moves the whole family at once.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Better Auth minor releases can require database migrations. Keep the
      # package family together and out of broad dependency bundles.
      better-auth:
        applies-to: version-updates
        patterns:
          - "better-auth"
          - "@better-auth/*"
      better-auth-security:
        applies-to: security-updates
        patterns:
          - "better-auth"
          - "@better-auth/*"
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
          - "better-auth"
          - "@better-auth/*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    # Permanent pins and deferred majors only (see the header).
    ignore:
      # Permanent: @types/node follows the runtime Node major (24).
      - dependency-name: "@types/node"
        versions: [">=25"]
      # Deferred: TypeScript 7 runs only in the typecheck job (tsgo, #87);
      # emit stays on TypeScript 6 until the follow-up in #230.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Deferred: undici 6 -> 8 (backend SSRF-safe fetch) needs its own
      # validation; not tracked by an issue yet.
      - dependency-name: "undici"
        update-types: ["version-update:semver-major"]

  # Base images of docker/Dockerfile (node, distroless). Digest and
  # minor/patch bumps only.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - area:infra
    commit-message:
      prefix: chore(deps)
    groups:
      docker-patch-and-minor:
        patterns:
          - "*"
    ignore:
      # Permanent: the runtime is Node 24 (docs/decisoes-iniciais.md §4).
      # Node 26 would be a separate decision, not a v0.2 upgrade.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gcr.io/distroless/nodejs24-debian13"
        update-types: ["version-update:semver-major"]

  # The Postgres image of docker/docker-compose.yml. The app image is built
  # by this repository, so only postgres is tracked here.
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - area:infra
    commit-message:
      prefix: chore(deps)
    allow:
      - dependency-name: "postgres"
    groups:
      docker-compose-patch-and-minor:
        patterns:
          - "*"

  # Actions are pinned by commit SHA; Dependabot bumps the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - area:infra
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions-patch-and-minor:
        patterns:
          - "*"
    # Action majors are not ignored: each one needs the allowed-actions list
    # updated by the maintainer before its PR can run.
