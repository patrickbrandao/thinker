# Dependabot version updates for Thinker.
#
# Until v0.2, only patch and minor (and digest) updates are proposed, grouped
# per ecosystem. Every major is ignored in every ecosystem, including
# `postgres`, `node`, the distroless base image and `@types/node`. In v0.2
# each major becomes its own issue and its own PR, in the order set by the
# upgrade policy (docs/decisoes-iniciais.md §4): PostgreSQL 18 → NestJS →
# TypeORM → Vite → TypeScript → Changesets, then the remaining majors. Each
# one is validated by qa-docker; a major the ecosystem does not support yet
# is documented and deferred. Remove the `semver-major` ignores below only
# as part of that work.
#
# uuid: its newer majors are ESM-only, and the CommonJS backend cannot
# require() them (upstream CI broke this way). Do not take a uuid major while
# the backend is CommonJS; #90 removes the dependency instead.
#
# The `applies-to: security-updates` groups below only take effect while
# Dependabot security updates are enabled for the repository. They are off
# today (automated-security-fixes disabled); turning them on is a maintainer
# decision proposed in #20, now that CI validates every Dependabot PR.

# npm version: Dependabot (dependabot-core npm_and_yarn PackageManagerHelper)
# reads the root `packageManager` field and installs that exact npm through
# Corepack before regenerating package-lock.json; `engines` and the
# lockfileVersion are only fallbacks. With `npm@10.9.2` it produced npm 10
# lockfiles that mark optional native deps `"peer": true` and break `npm ci`
# (#147). Keep `packageManager` equal to the npm bundled with the Node 24 used
# in CI (npm 11.19.0 today) and bump both together.

version: 2
updates:
  # npm workspaces: Dependabot reads the root package.json and every
  # workspace package.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - area:infra
    commit-message:
      prefix: chore(deps)
    groups:
      # vitest and @vitest/* pin each other via exact peer deps, so solo bumps
      # produce unresolvable PRs. Grouping them moves the whole family at once.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Better Auth minor releases can require database migrations. Keep the
      # package family together and out of broad dependency bundles.
      better-auth:
        applies-to: version-updates
        patterns:
          - "better-auth"
          - "@better-auth/*"
      better-auth-security:
        applies-to: security-updates
        patterns:
          - "better-auth"
          - "@better-auth/*"
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
          - "better-auth"
          - "@better-auth/*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Majors wait for v0.2 (see the header). This covers @types/node too,
      # which follows the runtime Node major.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Base images of docker/Dockerfile (node, distroless). Digest and
  # minor/patch bumps only.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - area:infra
    commit-message:
      prefix: chore(deps)
    groups:
      docker-patch-and-minor:
        patterns:
          - "*"
    ignore:
      # node and gcr.io/distroless/nodejs* majors wait for v0.2.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The Postgres image of docker/docker-compose.yml. The app image is built
  # by this repository, so only postgres is tracked here.
  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - area:infra
    commit-message:
      prefix: chore(deps)
    allow:
      - dependency-name: "postgres"
    groups:
      docker-compose-patch-and-minor:
        patterns:
          - "*"
    ignore:
      # PostgreSQL 18 is the first major of v0.2 and gets its own PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Actions are pinned by commit SHA; Dependabot bumps the SHA and the
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - area:infra
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions-patch-and-minor:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
