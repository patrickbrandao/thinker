# Managed by Thinker's installer. Keep local settings in `.env` or
# `docker-compose.override.yml` so upgrades can replace this file safely.
# thinker-compose-version: 1
#
# First boot: `docker compose up -d` starts the stack. Visit
# http://localhost:2099 and the app walks you through creating the first
# admin account via the setup wizard at /setup. No hardcoded credentials.
#
# Configuration comes from a `.env` file next to this compose file.
# Copy `.env.example` to `.env` and set BETTER_AUTH_SECRET and
# THINKER_ENCRYPTION_KEY (two different values) before
# booting. The install script does this automatically.
#
# Connecting local LLM servers (Ollama, LM Studio, or any OpenAI-compatible server):
# Install your server on the host, bind it to 0.0.0.0, and point Thinker
# at `http://host.docker.internal:<port>/v1`. Thinker auto-allows private
# and http URLs in the self-hosted version. See DOCKER_README.md for the
# full flow. Requires Docker Engine 20.10+.
#
# Before exposing this instance beyond localhost:
#   - Set real BETTER_AUTH_SECRET and THINKER_ENCRYPTION_KEY values in .env
#     (openssl rand -hex 32, once for each).
#   - To harden the database password, set BOTH `POSTGRES_PASSWORD` AND
#     `DATABASE_URL` in .env. They must agree — the password in the URL
#     must match POSTGRES_PASSWORD, and any special characters must be
#     percent-encoded in the URL.
#   - Confirm your admin password is strong (the setup wizard enforces
#     at least 8 characters).
#   - If you enable email verification (set EMAIL_PROVIDER / EMAIL_API_KEY),
#     set BETTER_AUTH_URL to a reachable public URL so the verification
#     links resolve.
#   - The app port binds to 127.0.0.1 by default. To expose on the LAN,
#     set HOST_BIND_ADDRESS=0.0.0.0 and update BETTER_AUTH_URL in .env to
#     match the host you reach it on.
#   - Behind a reverse proxy, set TRUST_PROXY in .env to the proxy's address
#     (see .env.example), so clients cannot spoof X-Forwarded-For.

# Pin the Compose project name so containers, networks, and volumes have
# stable, predictable names (thinker-*, thinker_*) regardless of the install
# directory's basename.
name: thinker

services:
  thinker:
    image: tmsoftbrasil/thinker:${THINKER_VERSION:-latest}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-${PORT:-2099}}:${PORT:-2099}"
    # Lets the container reach LLM servers running on the host (Ollama,
    # LM Studio, or any other OpenAI-compatible server) at
    # host.docker.internal:<port>. Requires Docker Engine 20.10+ (Docker
    # Desktop works out of the box).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Thinker listens on 2099 by default. Set PORT in .env to change both
      # the published host port and the internal listener.
      - PORT=${PORT:-2099}
      - DATABASE_URL=${DATABASE_URL:-postgresql://thinker:thinker@postgres:5432/thinker}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set in .env}
      # Required at-rest encryption key for stored provider keys, OAuth tokens
      # and request recordings. Must differ from BETTER_AUTH_SECRET.
      - THINKER_ENCRYPTION_KEY=${THINKER_ENCRYPTION_KEY:?THINKER_ENCRYPTION_KEY must be set in .env}
      # Rotation only: the previous encryption key. Stored credentials are
      # rewritten onto the current key after boot; remove it afterwards.
      - THINKER_ENCRYPTION_KEY_PREVIOUS=${THINKER_ENCRYPTION_KEY_PREVIOUS:-}
      # Public sign-up is closed; set to true to reopen it temporarily.
      - THINKER_ALLOW_SIGNUP=${THINKER_ALLOW_SIGNUP:-}
      # Fixed first-setup token (16+ chars). Empty prints a random one-time
      # token to the log instead.
      - THINKER_SETUP_TOKEN=${THINKER_SETUP_TOKEN:-}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:${HOST_PORT:-${PORT:-2099}}}
      # Extra hosts that may serve the dashboard/API, comma-separated. The
      # OAuth callback and session cookie follow the request host, so set this
      # when the same instance answers on more than one domain.
      - BETTER_AUTH_ALLOWED_HOSTS=${BETTER_AUTH_ALLOWED_HOSTS:-}
      # Which peers may set X-Forwarded-For / X-Forwarded-Proto (Express
      # "trust proxy"). The backend's own default trusts every private range,
      # which inside Docker lets a client on a private network spoof its IP
      # and get a fresh per-IP rate-limit bucket. Compose trusts only
      # loopback; set your reverse proxy's address or CIDR in .env when you
      # run one in front of Thinker (see .env.example).
      - TRUST_PROXY=${TRUST_PROXY:-loopback}
      - MCP_ENABLED=${MCP_ENABLED:-}
      # Defaults to the host-installed Ollama. Override in .env if your
      # Ollama runs elsewhere (e.g. on another host on your LAN).
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      # Built-in LM Studio / llama.cpp servers. Empty uses the host default.
      - THINKER_LMSTUDIO_BASE_URL=${THINKER_LMSTUDIO_BASE_URL:-}
      - THINKER_LLAMACPP_BASE_URL=${THINKER_LLAMACPP_BASE_URL:-}
      - PROVIDER_TIMEOUT_MS=${PROVIDER_TIMEOUT_MS:-180000}
      - STREAM_WARMUP_MS=${STREAM_WARMUP_MS:-15000}
      - CODEX_SEMANTIC_OUTPUT_TIMEOUT_MS=${CODEX_SEMANTIC_OUTPUT_TIMEOUT_MS:-60000}
      # Per-tenant concurrent in-flight request limit for this backend process.
      - THINKER_CONCURRENCY_MAX=${THINKER_CONCURRENCY_MAX:-10}
      # Per-tenant (M201) and per-IP (M202) requests/minute for this backend process.
      - THINKER_RATE_MAX_REQUESTS=${THINKER_RATE_MAX_REQUESTS:-200}
      - THINKER_IP_RATE_MAX_REQUESTS=${THINKER_IP_RATE_MAX_REQUESTS:-500}
      # Both are deliberately hardcoded, not `${VAR:-default}`. The image is a
      # production artifact: NODE_ENV=production is what makes it one, and the
      # seeder refuses to run under it anyway (database-seeder.service.ts logs
      # "SEED_DATA=true is ignored in production"). Exposing either as a knob
      # would only offer a setting that cannot take effect.
      - SEED_DATA=false
      - NODE_ENV=production
      # MCP clients whose Client ID Metadata Document lives on a private or
      # loopback host are refused unless this is true (SSRF guard, #18).
      - THINKER_CIMD_ALLOW_PRIVATE=${THINKER_CIMD_ALLOW_PRIVATE:-false}
      # Message recordings use this mounted Docker volume automatically when
      # S3-compatible bucket credentials are not present.
      - THINKER_RECORDING_STORAGE=${THINKER_RECORDING_STORAGE:-auto}
      - THINKER_RECORDING_FILESYSTEM_PATH=/data/request-recordings
      - THINKER_RECORDING_RETENTION_DAYS=${THINKER_RECORDING_RETENTION_DAYS:-}
      - THINKER_RECORDING_S3_BUCKET=${THINKER_RECORDING_S3_BUCKET:-}
      - THINKER_RECORDING_S3_ENDPOINT=${THINKER_RECORDING_S3_ENDPOINT:-}
      - THINKER_RECORDING_S3_REGION=${THINKER_RECORDING_S3_REGION:-}
      - THINKER_RECORDING_S3_ACCESS_KEY_ID=${THINKER_RECORDING_S3_ACCESS_KEY_ID:-}
      - THINKER_RECORDING_S3_SECRET_ACCESS_KEY=${THINKER_RECORDING_S3_SECRET_ACCESS_KEY:-}
      - THINKER_RECORDING_S3_FORCE_PATH_STYLE=${THINKER_RECORDING_S3_FORCE_PATH_STYLE:-false}
      # Email provider (optional). Covers both login/verification emails
      # and threshold alert notifications. Set one provider block — see
      # DOCKER_README.md "Email setup". Supports resend, mailgun, sendgrid.
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-}
      - EMAIL_API_KEY=${EMAIL_API_KEY:-}
      - EMAIL_DOMAIN=${EMAIL_DOMAIN:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      # OAuth providers (optional). Activate when both ID and SECRET are set.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      # Provider OAuth client overrides (optional). Only needed if you have
      # registered your own OAuth app with these providers instead of using
      # the defaults shipped with Thinker.
      - OPENAI_OAUTH_CLIENT_ID=${OPENAI_OAUTH_CLIENT_ID:-}
      - MINIMAX_OAUTH_CLIENT_ID=${MINIMAX_OAUTH_CLIENT_ID:-}
      # Programmatic API access via the X-API-Key header. Optional — the
      # dashboard uses cookie sessions and agents use their own thk_* keys.
      - API_KEY=${API_KEY:-}
      # Rate limiting. Window in ms + max requests per window per client.
      - THROTTLE_TTL=${THROTTLE_TTL:-60000}
      - THROTTLE_LIMIT=${THROTTLE_LIMIT:-100}
      # Database tuning. DB_POOL_MAX sizes the app pool, AUTH_DB_POOL_MAX the
      # separate pool Better Auth opens for itself.
      - DB_POOL_MAX=${DB_POOL_MAX:-10}
      - AUTH_DB_POOL_MAX=${AUTH_DB_POOL_MAX:-5}
      - DB_TUNE_SESSION=${DB_TUNE_SESSION:-}
      # Set false for multi-replica deploys where only one instance should run
      # migrations. A single-container compose install wants the default.
      - RUN_MIGRATIONS_ON_BOOT=${RUN_MIGRATIONS_ON_BOOT:-true}
      # Grace period (ms) to finish in-flight requests on SIGTERM. Spelled with
      # a real default rather than `:-` because the app reads it as
      # `Number(env ?? 10000)` — an empty string would coerce to 0, not 10000.
      - SHUTDOWN_DRAIN_MS=${SHUTDOWN_DRAIN_MS:-10000}
      # Suppresses the boot warning about HSTS on plain-HTTP deployments. Set
      # to 1 for HTTP-only LAN installs; prefer a real https:// BETTER_AUTH_URL
      # anywhere reachable from the internet.
      - THINKER_DISABLE_HSTS=${THINKER_DISABLE_HSTS:-}
      # Extra browser origins allowed to call the gateway (comma-separated).
      # None by default: the dashboard is same-origin.
      - THINKER_CORS_ORIGINS=${THINKER_CORS_ORIGINS:-}
      # Public model/price catalogs (ADR 0003): openrouter.ai and models.dev at
      # boot and daily, plus the OpenCode Go doc only when an OpenCode Go
      # provider exists. Set false for air-gapped installs; costs then come
      # from the bundled data only and most models show $0.
      - THINKER_CATALOG_SYNC=${THINKER_CATALOG_SYNC:-true}
      # Daily Harness usage rollup. Reads stay off until backfill parity passes.
      - AGENT_USAGE_DAILY_WORKER=${AGENT_USAGE_DAILY_WORKER:-}
      - AGENT_USAGE_DAILY_READS=${AGENT_USAGE_DAILY_READS:-}
      - AGENT_USAGE_DAILY_READ_TENANTS=${AGENT_USAGE_DAILY_READ_TENANTS:-}
      - AGENT_USAGE_DAILY_BATCH_SIZE=${AGENT_USAGE_DAILY_BATCH_SIZE:-}
      - AGENT_USAGE_DAILY_RUN_BUDGET_MS=${AGENT_USAGE_DAILY_RUN_BUDGET_MS:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "const p=process.env.PORT||'2099';fetch(`http://127.0.0.1:$${p}/api/v1/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      # Cold first-pull with migrations + pricing-cache warmup comfortably
      # runs past 60s. A 90s grace keeps Docker from flipping the container
      # to `unhealthy` (and tripping `depends_on: service_healthy`) while
      # the app is still legitimately booting.
      start_period: 90s
      retries: 3
    # Cap container logs at ~50 MB (5 × 10 MB) so a long-running install
    # can't fill the host disk via Docker's default unbounded json-file
    # driver. Rotated logs are still retrievable via `docker logs`.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 512
    volumes:
      - request_recordings:/data/request-recordings
    networks:
      - internal
      - frontend

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      - POSTGRES_USER=thinker
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-thinker}
      - POSTGRES_DB=thinker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U thinker
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

networks:
  internal:
    driver: bridge
    internal: true
  frontend:
    driver: bridge

volumes:
  # With `name: thinker` above these become thinker_pgdata and
  # thinker_request_recordings.
  pgdata:
  request_recordings:
