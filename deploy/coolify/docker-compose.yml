# Community-maintained template, not tested in CI.
# Thinker: https://github.com/patrickbrandao/thinker
services:
  thinker:
    image: tmsoftbrasil/thinker:0.1
    environment:
      - SERVICE_URL_THINKER_2099
      - PORT=2099
      - BIND_ADDRESS=0.0.0.0
      - DATABASE_URL=postgresql://thinker:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/thinker
      - BETTER_AUTH_SECRET=${SERVICE_HEX_64_AUTH}
      - THINKER_ENCRYPTION_KEY=${SERVICE_HEX_64_ENCRYPTION}
      - BETTER_AUTH_URL=${SERVICE_URL_THINKER_2099}
      - NODE_ENV=production
      - DB_POOL_MAX=10
      - AUTH_DB_POOL_MAX=5
      - THINKER_RECORDING_STORAGE=filesystem
      - THINKER_RECORDING_FILESYSTEM_PATH=/data/request-recordings
    volumes:
      - thinker-recordings-data:/data/request-recordings
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const p=process.env.PORT||'2099';fetch(`http://127.0.0.1:$${p}/api/v1/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      - POSTGRES_USER=thinker
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=thinker
    volumes:
      - thinker-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U thinker
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  thinker-postgres-data:
  thinker-recordings-data:
