# Community-maintained template, not tested in CI.
# Thinker: https://github.com/patrickbrandao/thinker
spec:
  name: thinker
  region: nyc
  services:
    - name: thinker
      image:
        registry_type: DOCKER_HUB
        registry: tmsoftbrasil
        repository: thinker
        tag: "0.1"
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-1gb
      http_port: 2099
      health_check:
        http_path: /api/v1/health
        port: 2099
        initial_delay_seconds: 30
        period_seconds: 10
        timeout_seconds: 5
        success_threshold: 1
        failure_threshold: 6
      envs:
        - key: BIND_ADDRESS
          scope: RUN_TIME
          value: 0.0.0.0
        - key: DATABASE_URL
          scope: RUN_TIME
          value: "${thinker-db.DATABASE_URL}&uselibpqcompat=true"
        - key: BETTER_AUTH_URL
          scope: RUN_TIME
          value: "${APP_URL}"
        - key: BETTER_AUTH_SECRET
          scope: RUN_TIME
          type: SECRET
        - key: THINKER_ENCRYPTION_KEY
          scope: RUN_TIME
          type: SECRET
        - key: REQUEST_RECORDING_STORAGE
          scope: RUN_TIME
          value: s3
        - key: REQUEST_RECORDING_S3_BUCKET
          scope: RUN_TIME
          type: SECRET
        - key: REQUEST_RECORDING_S3_ENDPOINT
          scope: RUN_TIME
          type: SECRET
        - key: REQUEST_RECORDING_S3_REGION
          scope: RUN_TIME
          value: us-east-1
        - key: REQUEST_RECORDING_S3_ACCESS_KEY_ID
          scope: RUN_TIME
          type: SECRET
        - key: REQUEST_RECORDING_S3_SECRET_ACCESS_KEY
          scope: RUN_TIME
          type: SECRET
        - key: REQUEST_RECORDING_S3_FORCE_PATH_STYLE
          scope: RUN_TIME
          value: "false"
        - key: DB_POOL_MAX
          scope: RUN_TIME
          value: "10"
        - key: AUTH_DB_POOL_MAX
          scope: RUN_TIME
          value: "5"
  databases:
    - name: thinker-db
      engine: PG
      version: "16"
